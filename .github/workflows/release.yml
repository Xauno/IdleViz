name: Release

# Pushing a tag like v0.1.0 builds the Windows setup file and the Mac disk image, and publishes a
# GitHub release with both. Nothing is published unless both were built and passed their tests.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows setup file
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      # The setup file takes its version from Directory.Build.props, so the tag has to say the same.
      - name: Check the tag against the version
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = "$($props.Project.PropertyGroup.Version)".Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag is $env:GITHUB_REF_NAME but Directory.Build.props says $version."
          }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        run: ./build-installer.ps1

      - name: Test installer
        run: ./installer/test-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: windows/artifacts/IdleViz-Setup.exe
          if-no-files-found: error

  mac:
    name: Mac disk image
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The app takes its version from the Xcode project, so the tag has to say the same.
      - name: Check the tag against the version
        run: |
          version="$(xcodebuild -project IdleViz.xcodeproj -scheme IdleViz -showBuildSettings | awk '$1 == "MARKETING_VERSION" { print $3 }')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but the Xcode project says $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build disk image
        run: installer/build-dmg.sh

      - name: Test disk image
        run: installer/test-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-disk-image
          path: artifacts/IdleViz.dmg
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/IdleViz-Setup.exe release/IdleViz.dmg
          --title "IdleViz $GITHUB_REF_NAME" --generate-notes --verify-tag
