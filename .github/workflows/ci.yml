name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  swift:
    name: Swift (lint, test, build app and disk image)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Build package
        run: swift build

      - name: Test package
        run: swift test

      # CI has no signing certificate. Local builds sign with the team in Config/Local.xcconfig.
      - name: Build app
        run: >
          xcodebuild build
          -project IdleViz.xcodeproj
          -scheme IdleViz
          -configuration Debug
          -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO

      # The Release build people download: both chip types, signed ad hoc, in a disk image.
      - name: Build disk image
        run: installer/build-dmg.sh

      # Mounts it and checks the app, its signature and the window's layout files.
      - name: Test disk image
        run: installer/test-dmg.sh

  windows:
    name: Windows (lint, test, build app and installer)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Show toolchain
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # The analyzers run in the build, and any warning fails it (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      # Installs, updates and uninstalls on the runner, and checks the files, shortcuts and registry.
      - name: Test installer
        shell: pwsh
        run: ./installer/test-installer.ps1

  # One stable check name for branch protection, so adding or renaming jobs never needs a settings change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [web, swift, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
