name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  swift:
    name: Swift (lint, test, build app)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Build package
        run: swift build

      - name: Test package
        run: swift test

      # CI has no signing certificate. Local builds sign with the team in Config/Local.xcconfig.
      - name: Build app
        run: >
          xcodebuild build
          -project IdleViz.xcodeproj
          -scheme IdleViz
          -configuration Debug
          -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO

  # One stable check name for branch protection, so adding or renaming jobs never needs a settings change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [web, swift]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
