<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IdleViz</title>
    <link rel="stylesheet" href="overlay.css" />
    <!-- Deferred scripts and modules run in document order, so the libraries are ready for visualizer.js. -->
    <script defer src="vendor/butterchurn.min.js"></script>
    <script defer src="vendor/butterchurnPresets.min.js"></script>
    <script defer src="vendor/butterchurnPresetsExtra.min.js"></script>
    <script defer src="vendor/butterchurnPresetsExtra2.min.js"></script>
    <script defer src="vendor/butterchurnPresetsMD1.min.js"></script>
    <script type="module" src="visualizer.js"></script>
    <script type="module" src="overlay.js"></script>
  </head>
  <body>
    <!-- Bottom to top: visualizer, dim layer, overlay. -->
    <div id="viz"></div>
    <div id="dim"></div>
    <div id="stage" class="hidden">
      <div id="scrim"></div>
      <div id="tracks"></div>
      <div id="ad-label">Advertisement</div>
      <div id="progress">
        <span id="elapsed" class="time"></span>
        <div id="bar"><div id="played"></div></div>
        <span id="duration" class="time"></span>
      </div>
    </div>
  </body>
</html>
